[project]
name = "etkinlikcepte-pipeline"
version = "0.1.0"
description = "EtkinlikCepte ETL hattı (§3.3, §5)"
requires-python = ">=3.13"
dependencies = [
  "dramatiq",
  "apscheduler",
  "scrapy==2.19",
  "parsel",
  "lxml==6.1",
  "playwright",
  "feedparser",
  "extruct",
  "rapidfuzz",
  "shapely",
  "polars==2.0.0",
  "faker",
  "redis>=8.1.0",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
