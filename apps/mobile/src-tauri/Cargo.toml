[package]
name = "etkinlikcepte"
version = "0.1.0"
description = "EtkinlikCepte mobile shell"
authors = ["Abdullah Hilal"]
edition = "2021"

[lib]
name = "etkinlikcepte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
