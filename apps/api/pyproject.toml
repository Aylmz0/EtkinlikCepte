[project]
name = "etkinlikcepte-api"
version = "0.1.0"
description = "EtkinlikCepte FastAPI backend (§3.2, §5)"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.142",
  "uvicorn[standard]",
  "pydantic==2.13",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "alembic",
  "argon2-cffi",
  "pyjwt",
  "structlog",
  "limits",
  "livekit-api",
  "segno",
  "orjson>=3.13.0",
  "hiredis>=3.4.2",
  "valkey>=6.1.1",
  "geoalchemy2>=0.20.0",
  "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.alembic]
script_location = "alembic"
