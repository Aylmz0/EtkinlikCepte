# Tek doğruluk kaynağı (§4.7). Buradaki sürümler bilgi amaçlı değil, bağlayıcıdır.
# `development.md` §3'teki sürümlerle çelişirse bu dosya kazanır.
[tools]
node = "24"
python = "3.13"
# Podman stays system-managed (no stable mise backend to verify); the
# compose stack assumes a working podman + compose provider (§3.4).
uv = "0.11"
just = "1.57"
# Hurl is a standalone Rust CLI for `just hurl`; not a Python/npm dependency.
hurl = "8.0.1"
