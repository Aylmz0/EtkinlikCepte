# LiveKit tek node (§2). Portlar §13.2 ile aynı olmalı.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  port_range_start: 50000
  port_range_end: 50100
  # Düğüm IP'si compose'dan `--node-ip` bayrağıyla verilir (LIVEKIT_NODE_IP); bu yüzden dış IP keşfi kapalı.
  use_external_ip: false
keys:
  # Geliştirme anahtarı. Gerçek anahtar depoya girmez (SOPS/Infisical, §13.2).
  devkey: secret
