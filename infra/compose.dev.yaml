# Yerel geliştirme farkları. `just dev` bunu compose.yaml ile yükler.
# DB ve servis portları yalnızca localhost'a açılır.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  valkey:
    ports:
      - "127.0.0.1:6379:6379"
  martin:
    ports:
      - "127.0.0.1:3000:3000"
  livekit:
    # Telefonla yerel deneme için LIVEKIT_BIND/LIVEKIT_NODE_IP (infra/docs/ports.md, R9).
    command: ["--config", "/etc/livekit.yaml", "--dev", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    ports:
      - "${LIVEKIT_BIND:-127.0.0.1}:7880:7880"
      - "${LIVEKIT_BIND:-127.0.0.1}:7881:7881"
      - "${LIVEKIT_BIND:-127.0.0.1}:7882:7882/udp"
